<!DOCTYPE html>
<html lang="ca">
<head>
  <link rel="icon" type="image/png" href="Favi.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Racó de bits - Kidòria</title>
<style>
   header {
  text-align: center;
  padding: 2rem;
  background-color: #4BC6B9;
  color: #FFFFFF;
  }
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(#00cfff, #004f7f);
  color: white;
  text-align: center;
  padding: 20px;
  overflow: hidden;
}
h1 { font-size: 2em; margin-bottom: 10px; text-shadow: 2px 2px 5px #000; }
#game { display: flex; flex-wrap: wrap; justify-content: center; max-width: 900px; margin: 20px auto; }
.card {
  width: 100px; height: 100px; margin: 8px;
  background: #0077b6;
  border-radius: 12px;
  cursor: pointer;
  display: flex; justify-content: center; align-items: center;
  font-size: 50px; color: white;
  transform: rotateY(0deg);
  transition: transform 0.6s;
  perspective: 1000px;
  position: relative;
}
.card.flipped { transform: rotateY(180deg); background: #00bfff; }
#score { font-size: 20px; margin-top: 20px; }
#effects { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow: hidden; z-index: 9999; }

/* Partícules màgiques */
.particle {
  position: absolute; width: 20px; height: 20px; background: yellow; border-radius: 50%;
  animation: floatUp 1s ease-out forwards;
}
@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity:1; }
  100% { transform: translateY(-100px) scale(0.5); opacity:0; }
}

/* Bombolles */
.bubble {
  position: absolute; width: 15px; height: 15px; background: rgba(255,255,255,0.7); border-radius: 50%;
  animation: rise 4s linear forwards;
}
@keyframes rise {
  0% { transform: translateY(0) scale(0.5); opacity:0.8; }
  50% { opacity:1; }
  100% { transform: translateY(-400px) scale(1); opacity:0; }
}
</style>
</head>

  <header>
    <h1>🌊 Memòria Oceànica 🌊</h1>
    <p>Troba les parelles i deixa que l’oceà cobreixi de màgia!</p>
  </header>
<body>
    <div id="game"></div>
    <p id="score">Punts: 0 | Nivell: 1</p>

<div id="effects"></div>

<!-- Sons -->
<audio id="sound-correct" src="https://freesound.org/data/previews/331/331912_3248244-lq.mp3"></audio>
<audio id="sound-wrong" src="https://freesound.org/data/previews/66/66717_931655-lq.mp3"></audio>
<audio id="music" src="missio.mp3" loop autoplay></audio>

<script>
// Nivells amb més cartes progressivament
let levels = [
  ['🐠','🐬','🦀','🐙'],
  ['🐠','🐬','🦀','🐙','🦑','🐡'],
  ['🐠','🐬','🦀','🐙','🦑','🐡','🐟','🦐']
];
let currentLevel = 0;
let symbols = levels[currentLevel];
let cardsArray = [...symbols, ...symbols];
cardsArray.sort(() => 0.5 - Math.random());

const gameDiv = document.getElementById('game');
const scoreEl = document.getElementById('score');
const effectsDiv = document.getElementById('effects');

let flipped = [];
let matchedPairs = 0;
let score = 0;

// Creació de cartes
function createCards() {
  gameDiv.innerHTML = '';
  cardsArray.forEach(symbol => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.dataset.symbol = symbol;
      card.addEventListener('click', flipCard);
      gameDiv.appendChild(card);
  });
}
createCards();

function flipCard(e){
    const card = e.target;
    if(card.classList.contains('flipped') || flipped.length === 2) return;

    card.textContent = card.dataset.symbol;
    card.classList.add('flipped');
    flipped.push(card);

    if(flipped.length === 2){
        setTimeout(checkMatch, 600);
    }
}

function checkMatch(){
    const [card1, card2] = flipped;
    if(card1.dataset.symbol === card2.dataset.symbol){
        score += 10;
        matchedPairs++;
        playEffect(card1);
        document.getElementById('sound-correct').play();
        card1.style.background = '#00ff7f';
        card2.style.background = '#00ff7f';
    } else {
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          card1.textContent = '';
          card2.textContent = '';
        }, 400);
        document.getElementById('sound-wrong').play();
    }
    flipped = [];
    updateScore();
    if(matchedPairs === symbols.length){
        setTimeout(nextLevel, 1000);
    }
}

function updateScore(){
    scoreEl.textContent = `Punts: ${score} | Nivell: ${currentLevel+1}`;
}

function nextLevel(){
    currentLevel++;
    if(currentLevel >= levels.length){
        alert(`🎉 Felicitats! Has completat tots els nivells amb ${score} punts! 🌊`);
        return;
    }
    symbols = levels[currentLevel];
    cardsArray = [...symbols, ...symbols];
    cardsArray.sort(() => 0.5 - Math.random());
    flipped = [];
    matchedPairs = 0;
    createCards();
    updateScore();
}

// Partícules màgiques
function playEffect(card){
    for(let i=0; i<5; i++){
        const particle = document.createElement('div');
        particle.classList.add('particle');
        particle.style.left = (card.offsetLeft + 30 + Math.random()*40) + 'px';
        particle.style.top = (card.offsetTop + 30 + Math.random()*40) + 'px';
        effectsDiv.appendChild(particle);
        setTimeout(() => particle.remove(), 1000);
    }
}

// Bombolles contínues
function createBubble(){
    const bubble = document.createElement('div');
    bubble.classList.add('bubble');
    bubble.style.left = Math.random() * window.innerWidth + 'px';
    bubble.style.width = (10 + Math.random()*20) + 'px';
    bubble.style.height = bubble.style.width;
    effectsDiv.appendChild(bubble);
    setTimeout(() => bubble.remove(), 4000);
}
setInterval(createBubble, 300);

</script>
</body>
</html>
