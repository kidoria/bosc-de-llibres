<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Racó de bits - Kidòria</title>
<link rel="icon" type="image/png" href="Favi.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    header {
  text-align: center;
  padding: 2rem;
  background-color: #4BC6B9;
  color: #FFFFFF;
  }
/* Fons animat */
body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;
  color: white;
  text-align: center;
  background: linear-gradient(135deg, #ffcc00, #ff5733, #00b3b3, #8e2de2);
  background-size: 300% 300%;
  animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Títol */
h1 {
  margin-top: 30px;
  font-size: 30px;
  text-shadow: 0 0 10px rgba(255,255,255,0.6);
}

/* Caixa de la història */
.story-box {
  max-width: 850px;
  margin: 25px auto;
  background: #ffffff;
  padding: 25px;
  border-radius: 20px;
  backdrop-filter: blur(6px);
  box-shadow: 0 0 20px rgba(0,0,0,0.25);
  font-size: 18px;
  line-height: 1.6;
  animation: fadeIn 0.8s ease;
  color: #000000;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Botons */
button {
  padding: 12px 26px;
  font-size: 17px;
  border: none;
  border-radius: 25px;
  background: #4BC6B9;
  color: white;
  cursor: pointer;
  margin: 10px;
  transition: 0.25s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

button:hover {
  transform: scale(1.07);
  opacity: 0.9;
}

/* Botó música */
#musicButton {
  margin-bottom: 10px;
}

/* Efectes màgics */
.sparkle {
  position: fixed;
  width: 6px;
  height: 6px;
  background: white;
  border-radius: 50%;
  pointer-events: none;
  animation: sparkleAnim 1s linear forwards;
}

@keyframes sparkleAnim {
  from { opacity: 1; transform: scale(1); }
  to { opacity: 0; transform: scale(2); }
}

/* Contenidor de botons de decisió */
#choices {
  margin-bottom: 30px;
}
</style>
</head>
<header> 
    <h1>Ajuda a BRANCAFORTA a contar la història d’avui</h1>
</header>

<body>

<button id="musicButton">🎵 Música</button>

<audio id="bgMusic" loop>
  <source src="arbre.mp3" type="audio/mpeg">
</audio>

<div id="story" class="story-box"></div>

<div id="choices"></div>

<script>
/* ——— MÚSICA AMB FADE-IN / OUT ——— */
const music = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicButton");
let isPlaying = false;
let fadeInterval = null;

function fadeIn(audio) {
  clearInterval(fadeInterval);
  audio.volume = 0;
  audio.play();
  fadeInterval = setInterval(() => {
    if (audio.volume < 0.9) audio.volume += 0.05;
    else { audio.volume = 1; clearInterval(fadeInterval); }
  }, 120);
}

function fadeOut(audio) {
  clearInterval(fadeInterval);
  fadeInterval = setInterval(() => {
    if (audio.volume > 0.05) audio.volume -= 0.05;
    else { audio.volume = 0; audio.pause(); clearInterval(fadeInterval); }
  }, 120);
}

musicBtn.addEventListener("click", () => {
  if (!isPlaying) {
    fadeIn(music);
    musicBtn.textContent = "🔇 Silenciar";
    isPlaying = true;
  } else {
    fadeOut(music);
    musicBtn.textContent = "🎵 Música";
    isPlaying = false;
  }
});

/* ——— EFECTE MÀGIC DE BRILLANTS ——— */
document.addEventListener("mousemove", e => {
  const sparkle = document.createElement("div");
  sparkle.classList.add("sparkle");
  sparkle.style.left = e.pageX + "px";
  sparkle.style.top = e.pageY + "px";
  document.body.appendChild(sparkle);
  setTimeout(() => sparkle.remove(), 1000);
});

/* ——— HISTÒRIA RAMIFICADA ——— */
/*

*/

/* ——— MOTOR DE LA HISTÒRIA ——— */
const storyEl = document.getElementById("story");
const choicesEl = document.getElementById("choices");

function renderNode(nodeKey) {
  const node = storyData[nodeKey];
  if (!node) return;

  storyEl.innerHTML = node.text;
  choicesEl.innerHTML = "";

  node.choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.textContent = choice.text;
    btn.addEventListener("click", () => renderNode(choice.next));
    choicesEl.appendChild(btn);
  });
}

/* Inici de la història */
renderNode("start");
</script>

</body>
</html>
